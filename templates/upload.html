<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Dataset</title>
</head>
<body>

    <h2>Upload CSV</h2>
    
    <!-- Upload Form -->
    <form action="/upload" method="POST" enctype="multipart/form-data">
        <input type="file" name="file" accept=".csv" required>
        <button type="submit">Upload & Process</button>
    </form>

    <!-- Dropdown appears after upload -->
    {% if features %}
        <h3>Select the dependent Feature:</h3>
        <form action="/training" method="POST">
            <select name="selected_feature">
                {% for col in features %}
                    <option value="{{ col }}">{{ col }}</option>
                {% endfor %}
            </select>
            <button type="submit">Confirm Feature</button>
        </form>
    {% endif %}

</body>
</html>
