<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Dataset - Model Trainer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    nav a { color: #64748b; text-decoration: none; font-size: 0.85rem; }
    nav a:hover { color: #2563eb; }
    .tag {
      font-size: 0.72rem;
      font-weight: 600;
      color: #2563eb;
      background: #eff6ff;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      display: inline-block;
      margin-top: 12px;
    }
    h2 { font-size: 1.25rem; margin: 4px 0; }
    p { color: #64748b; font-size: 0.85rem; margin-bottom: 16px; }
    form { display: flex; flex-direction: column; gap: 12px; }
    label { font-size: 0.8rem; font-weight: 600; display: block; }
    input, select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.85rem;
      background: #fff;
    }
    .btn {
      padding: 9px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #1d4ed8; }
    hr { border: none; border-top: 1px solid #e2e8f0; margin: 18px 0; }
    #file-info { font-size: 0.78rem; color: #2563eb; }
  </style>
</head>
<body>
  <main class="card">
    <nav><a href="/">← Back to Home</a></nav>

    <span class="tag">Step 1</span>
    <h2>Upload Dataset</h2>
    <p>Choose a CSV file to split into training and testing sets.</p>

    <form action="/upload" method="POST" enctype="multipart/form-data">
      <label for="file">Dataset (.csv)</label>
      <input type="file" id="file" name="file" accept=".csv" required onchange="showFile(this)">
      <p id="file-info"></p>
      <button type="submit" class="btn">Upload and Process</button>
    </form>

    {% if features %}
      <hr>
      <span class="tag">Step 2</span>
      <h2>Select Target Column</h2>
      <p>Choose the feature you want the model to predict.</p>

      <form action="/training" method="POST">
        <label for="selected_feature">Target Column</label>
        <select id="selected_feature" name="selected_feature" required>
          {% for col in features %}
            <option value="{{ col }}">{{ col }}</option>
          {% endfor %}
        </select>
        <button type="submit" class="btn">Confirm Target & Train →</button>
      </form>
    {% endif %}
  </main>

  <script>
    function showFile(el) {
      document.getElementById("file-info").textContent = el.files[0] ? "Selected: " + el.files[0].name : "";
    }
  </script>
</body>
</html>
