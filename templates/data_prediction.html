<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Data Prediction</title>
</head>
<body>
    <nav>
        <a href="/">Home</a> | 
        <a href="/upload">Upload Dataset</a>
    </nav>

    <h2>Data Prediction</h2>

    <!-- Prediction Form -->
    <form action="/predict" method="POST">
        {% for feature in features %}
            <div>
                <label for="{{ feature }}">{{ feature }}:</label>
                
                {% if feature in cat_feature_info %}
                    <!-- Categorical Feature Dropdown -->
                    <select id="{{ feature }}" name="{{ feature }}" required>
                        <option value="" disabled selected>Select {{ feature }}</option>
                        {% for val in cat_feature_info[feature]['values'] %}
                            <option value="{{ val }}">{{ val }}</option>
                        {% endfor %}
                    </select>
                {% else %}
                    <!-- Numerical Feature Input -->
                    <input type="number" step="any" id="{{ feature }}" name="{{ feature }}" placeholder="Enter number" required>
                {% endif %}
            </div>
            <br>
        {% endfor %}
        <button type="submit">Predict</button>
    </form>

    <!-- Prediction Results -->
    {% if result is not none %}
        <hr>
        <h3>Prediction Result: {{ result }}</h3>
    {% elif results %}
        <hr>
        <h3>Prediction Result: {{ results }}</h3>
    {% endif %}
</body>
</html>
