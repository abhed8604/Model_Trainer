<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Training - Model Trainer</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-muted: #64748b;
            --radius: 12px;
            --shadow: 0 10px 15px -3px rgb(0 0 0 / 0.04), 0 4px 6px -4px rgb(0 0 0 / 0.04);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .container {
            width: 100%;
            max-width: 560px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 36px 32px;
        }
        nav {
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            font-size: 0.875rem;
        }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
        }
        nav a:hover {
            color: var(--primary);
        }
        h2 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }
        .target-box {
            background: #f1f5f9;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            margin: 16px 0 24px;
            font-size: 0.9rem;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .target-box span {
            color: var(--text-muted);
        }
        .target-box strong {
            color: var(--primary);
            font-weight: 600;
        }
        #loading-section {
            margin: 24px 0;
            text-align: center;
        }
        #status-text {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 14px;
        }
        #progress-container {
            width: 100%;
            background: #e2e8f0;
            height: 10px;
            border-radius: 9999px;
            overflow: hidden;
        }
        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #2563eb);
            border-radius: 9999px;
            transition: width 0.4s ease;
        }
        .metric-card {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .metric-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            font-size: 0.9rem;
        }
        .metric-label {
            color: var(--text-muted);
        }
        .metric-value {
            font-weight: 600;
            color: var(--text);
        }
        h3 {
            font-size: 1.05rem;
            font-weight: 600;
            margin: 20px 0 10px;
            color: var(--text);
        }
        .table-wrap {
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 24px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }
        th, td {
            padding: 10px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        tr:last-child td {
            border-bottom: none;
        }
        th {
            background: #f8fafc;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        td {
            color: var(--text);
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 11px 20px;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.15s;
        }
        .btn:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="/">Home</a> · <a href="/upload">Upload Another Dataset</a>
        </nav>

        <h2>Model Training</h2>

        <div class="target-box">
            <span>Target Feature:</span>
            <strong>{{ selected_feature }}</strong>
        </div>

        <!-- Progress State -->
        <div id="loading-section">
            <p id="status-text">Training models and tuning hyperparameters...</p>
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
        </div>

        <!-- Results (hidden until training finishes) -->
        <div id="results-section" style="display:none;">
            <h3>Best Model Result</h3>
            <div class="metric-card">
                <div class="metric-row">
                    <span class="metric-label">Best Algorithm</span>
                    <strong id="best-model" class="metric-value"></strong>
                </div>
                <div class="metric-row">
                    <span class="metric-label">Model Score (R²)</span>
                    <strong id="score" class="metric-value"></strong>
                </div>
            </div>

            <h3>All Models Evaluation</h3>
            <div class="table-wrap">
                <table id="report-table">
                    <thead>
                        <tr><th>Model</th><th>Score (R²)</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <a href="/predict" class="btn">Proceed to Data Prediction →</a>
        </div>
    </div>

    <script>
        const selectedFeature = "{{ selected_feature }}";
        const progressBar = document.getElementById("progress-bar");
        const statusText = document.getElementById("status-text");

        // Simulates gradual progress while training runs
        let progress = 10;
        progressBar.style.width = progress + "%";
        const interval = setInterval(() => {
            if (progress < 90) {
                progress += 10;
                progressBar.style.width = progress + "%";
            }
        }, 1200);

        // Call the training API
        fetch("/api/train", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ selected_feature: selectedFeature })
        })
        .then(res => res.json())
        .then(data => {
            clearInterval(interval);
            progressBar.style.width = "100%";

            setTimeout(() => {
                document.getElementById("loading-section").style.display = "none";
                document.getElementById("results-section").style.display = "block";

                document.getElementById("best-model").textContent = data.best_model_name;
                document.getElementById("score").textContent = data.score;

                const tbody = document.querySelector("#report-table tbody");
                tbody.innerHTML = "";
                for (const [model, details] of Object.entries(data.model_report)) {
                    const row = `<tr><td>${model}</td><td>${details.score}</td></tr>`;
                    tbody.innerHTML += row;
                }
            }, 500);
        })
        .catch(err => {
            clearInterval(interval);
            statusText.textContent = "Training failed. Please check your logs.";
            statusText.style.color = "#dc2626";
        });
    </script>
</body>
</html>
