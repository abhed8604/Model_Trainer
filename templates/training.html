<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Model Training - Model Trainer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    nav a { color: #64748b; text-decoration: none; font-size: 0.85rem; }
    nav a:hover { color: #2563eb; }
    h2 { font-size: 1.25rem; margin: 12px 0 8px; }
    .panel {
      background: #f1f5f9;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
    }
    .success { background: #f0fdf4; color: #15803d; }
    #status { color: #64748b; font-size: 0.84rem; margin-bottom: 8px; }
    .track {
      background: #e2e8f0;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    #bar {
      width: 20%;
      height: 100%;
      background: #2563eb;
      transition: width 0.3s;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
      margin: 10px 0 16px;
    }
    th, td { padding: 8px; border-bottom: 1px solid #e2e8f0; text-align: left; }
    th { color: #64748b; }
    .btn {
      display: block;
      padding: 10px;
      background: #2563eb;
      color: #fff;
      border-radius: 6px;
      text-align: center;
      text-decoration: none;
      font-weight: 600;
    }
    .btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <main class="card">
    <nav><a href="/">Home</a> · <a href="/upload">Upload Dataset</a></nav>

    <h2>Model Training</h2>
    <div class="panel">
      <span>Target Feature:</span>
      <strong>{{ selected_feature }}</strong>
    </div>

    <section id="loading">
      <p id="status">Training models and tuning hyperparameters...</p>
      <div class="track"><div id="bar"></div></div>
    </section>

    <section id="results" style="display: none;">
      <div class="panel success">
        <span>Best: <strong id="best-name"></strong></span>
        <span>R² Score: <strong id="best-score"></strong></span>
      </div>

      <table>
        <tr>
          <th>Model</th>
          <th style="text-align: right;">R² Score</th>
        </tr>
        <tbody id="rows"></tbody>
      </table>

      <a href="/predict" class="btn">Proceed to Prediction →</a>
    </section>
  </main>

  <script>
    const bar = document.getElementById("bar");
    let pct = 15;
    const timer = setInterval(() => {
      if (pct < 90) bar.style.width = (pct += 10) + "%";
    }, 1000);

    fetch("/api/train", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ selected_feature: "{{ selected_feature }}" })
    })
      .then(r => r.json())
      .then(data => {
        clearInterval(timer);
        bar.style.width = "100%";
        document.getElementById("loading").style.display = "none";
        document.getElementById("results").style.display = "block";
        document.getElementById("best-name").textContent = data.best_model_name;
        document.getElementById("best-score").textContent = Number(data.score).toFixed(4);

        const items = Object.entries(data.model_report).sort((a, b) => b[1].score - a[1].score);
        document.getElementById("rows").innerHTML = items.map(([name, item]) => `
          <tr style="${name === data.best_model_name ? 'font-weight:600;color:#15803d;' : ''}">
            <td>${name}</td>
            <td style="text-align:right;">${Number(item.score).toFixed(4)}</td>
          </tr>
        `).join("");
      })
      .catch(() => {
        clearInterval(timer);
        document.getElementById("status").textContent = "Training failed. Check server logs.";
        document.getElementById("status").style.color = "#dc2626";
      });
  </script>
</body>
</html>
